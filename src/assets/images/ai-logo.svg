<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- 背景流光渐变：科技蓝紫至深紫罗兰 -->
    <linearGradient id="aiIconBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8F88FF"/>
      <stop offset="50%" stop-color="#7B74F3"/>
      <stop offset="100%" stop-color="#5B52E0"/>
    </linearGradient>

    <!-- 微米级高光描边渐变 -->
    <linearGradient id="aiIconBorderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>

    <!-- 柔和阴影滤波 -->
    <filter id="aiIconDropShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#7B74F3" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 外层 Apple 风格连续曲率圆角底座 -->
  <rect x="4" y="4" width="40" height="40" rx="12" fill="url(#aiIconBgGradient)" filter="url(#aiIconDropShadow)"/>
  
  <!-- 内发光描边 -->
  <rect x="4.5" y="4.5" width="39" height="39" rx="11.5" stroke="url(#aiIconBorderGradient)" stroke-width="1"/>

  <!-- 主 AI 智能星芒 (Central AI Sparkle) -->
  <path d="M24 12C24 17.5 19.5 22 14 22C19.5 22 24 26.5 24 32C24 26.5 28.5 22 34 22C28.5 22 24 17.5 24 12Z" fill="#FFFFFF"/>

  <!-- 伴生副星芒 (Satellite Secondary Sparkle - 右上) -->
  <path d="M33 13C33 15.2 31.2 17 29 17C31.2 17 33 18.8 33 21C33 18.8 34.8 17 37 17C34.8 17 33 15.2 33 13Z" fill="#FFFFFF" fill-opacity="0.85"/>
</svg>